name: Summary checks
on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: python -m unittest discover -s tests -v
      - run: python tests/preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: summary-preview-synthetic
          path: summary_output/preview.png
