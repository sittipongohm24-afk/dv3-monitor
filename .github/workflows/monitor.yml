name: DV3 update monitor

on:
  schedule:
    - cron: "7 * * * *"

  workflow_dispatch:
    inputs:
      test:
        description: "ส่งข้อความทดสอบเข้า Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: dv3-monitor

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: pip install playwright==1.58.0

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Install Thai fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Summarize pending announcements
        if: ${{ always() && inputs.test != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_SUMMARY_WEBHOOK_URL: ${{ secrets.DISCORD_SUMMARY_WEBHOOK_URL }}
        run: python summary.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if [ -f summary_state.json ]; then git add summary_state.json; fi
          if [ -d summary_output ]; then git add summary_output/*.json; fi
          git diff --cached --quiet || (git commit -m "update seen posts" && git push)

      - name: Keep summary image for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dv3-summary
          path: summary_output/*.png
          if-no-files-found: ignore
          retention-days: 14
